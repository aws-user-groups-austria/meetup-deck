name: CI

# The tests on every change. They build their own small template, so they need
# neither the group's real slide deck nor the network.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing is granted at workflow level. The job only reads the repository.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install, exactly as locked
        run: uv sync --locked

      - name: Tests
        run: uv run --locked pytest
