[project]
name = "meetup-deck"
version = "0.1.0"
description = "Fill in the AWS User Group Vienna slide deck for one meetup from its event.json"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-pptx>=1.0.2,<2",
  "pillow>=12,<14",
  "segno>=1.6,<2",
]

[project.scripts]
meetup-deck = "meetup_deck.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meetup_deck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
